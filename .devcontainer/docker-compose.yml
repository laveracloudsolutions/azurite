version: '3.8'
services:
  devcontainer:
    image: "mcr.microsoft.com/devcontainers/base:ubuntu"
    volumes:
      - ..:/workspace:cached
    network_mode: service:azurite
    command: sleep infinity

  azurite:
    image: "ghcr.io/laveracloudsolutions/azurite:latest"
    hostname: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"